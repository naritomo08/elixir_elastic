<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elixir Elasticsearch Log Search</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="header">
        <div>
          <p class="eyebrow">Elasticsearch Log Search</p>
          <h1>ログのキーワード検索</h1>
          <p class="note">検索結果は条件に一致したログのうち最新50件のみ表示します。</p>
        </div>
      </section>

      <form id="search-form" class="search" method="post" action="/">
        <label>
          <span>TIME From (JST)</span>
          <input type="datetime-local" name="time_from" aria-label="TIME From (JST)">
        </label>
        <label>
          <span>TIME To (JST)</span>
          <input type="datetime-local" name="time_to" aria-label="TIME To (JST)">
        </label>
        <label>
          <span>LOG</span>
          <select name="log_type" aria-label="LOG">
            <option value="">すべて</option>
          </select>
        </label>
        <label>
          <span>HOST</span>
          <input type="search" name="host" placeholder="例: elastic1, flink1" aria-label="HOST">
        </label>
        <label>
          <span>PROGRAM</span>
          <input type="search" name="program" placeholder="例: sshd, systemd, hdfs" aria-label="PROGRAM">
        </label>
        <label class="message-filter">
          <span>Message</span>
          <input type="search" name="message" placeholder="例: accepted, JournalNodeSyncer" aria-label="Message" autofocus>
        </label>
        <div class="search-actions">
          <a id="clear-link" class="reset-link" href="/clear">クリア</a>
          <button type="submit">検索</button>
        </div>
      </form>

      <section id="results" class="results" aria-live="polite">
        <div id="results-summary" class="summary"><span>検索を実施してください</span></div>
        <p id="results-body" class="empty">検索条件を入力して検索ボタンを押してください。</p>
      </section>
    </main>
    <script src="/static/search.js"></script>
  </body>
</html>
